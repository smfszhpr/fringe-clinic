<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>患者接诊 · 临界诊室</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2f5;color:#223944;font:15px/1.7 system-ui}header{background:#102832;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px;letter-spacing:2px}small{color:#849ba6}main{max-width:1350px;margin:28px auto;display:grid;grid-template-columns:310px 1fr;gap:24px;padding:0 20px}.card{background:white;border:1px solid #d4dfe4;border-radius:10px;padding:20px;margin-bottom:14px;cursor:pointer}.card.selected{border:2px solid #187c78;padding:19px;background:#effaf7}.badge{font-size:12px;color:#297773}h2{font-size:19px;margin:5px 0}p{margin:8px 0}.paper{background:white;padding:34px;border:1px solid #d0dce2;box-shadow:0 8px 30px #14303e0b}.title{text-align:center;border-bottom:2px solid #36545e;padding-bottom:20px;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #d8e0e4;padding-bottom:15px;gap:12px}.field small{display:block;color:#657d88}.record{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid #e6ecef;padding:14px 0}.record b{font-weight:600}.record p{margin:0;white-space:pre-wrap}button{background:#147971;color:white;border:0;border-radius:7px;padding:13px 24px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:25px;gap:20px}.error{color:#b24332}a{color:#a5e2d6}@media(max-width:800px){main{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.paper{padding:20px}}</style>
<link rel="stylesheet" href="/ward.css"><body class="admissions"><header class="mast"><div class="brand"><b aria-hidden="true">✚</b><div><small>FRINGE CLINIC</small><h1>临界诊室</h1></div></div><nav><span aria-current="page">患者接诊</span><a href="/clinic">诊疗工作台</a></nav></header><main><aside><h2>待接诊患者</h2><p><small>三个病例有相近主诉。依据已知资料选择，诊断需要在接诊中建立。</small></p><div id="list">正在读取病案…</div></aside><article class="paper"><div class="title"><small>临界诊室 · 虚构教学病案</small><h2>急诊首次病程记录</h2><span id="recordId"></span></div><div id="summary" class="grid"></div><div id="records"></div><div class="footer"><small>本页仅含入院时已知信息；“待核实”不代表阴性。</small><button id="admit" disabled>接诊此患者</button></div><p id="status" class="error"></p></article></main><script>
let patients=[],selected;const $=id=>document.getElementById(id);const basics=['姓名','性别','年龄','职业','就诊科室','就诊方式','信息来源'];function select(p){selected=p;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('selected',c.dataset.id===p.id));$('recordId').textContent='病案号 '+p.chart['病案号'];$('summary').replaceChildren();$('records').replaceChildren();for(const key of basics){const d=document.createElement('div');d.className='field';const label=document.createElement('small');label.textContent=key;const value=document.createElement('span');value.textContent=p.chart[key]||'未记录';d.append(label,value);$('summary').append(d)}for(const [key,value]of Object.entries(p.chart)){if([...basics,'病案号','记录类型'].includes(key))continue;const d=document.createElement('div');d.className='record';const b=document.createElement('b');b.textContent=key;const v=document.createElement('p');v.textContent=value;d.append(b,v);$('records').append(d)}$('admit').disabled=false}
fetch('/api/patients').then(r=>{if(!r.ok)throw Error('病案读取失败');return r.json()}).then(r=>{patients=r.patients;$('list').replaceChildren();for(const p of patients){const card=document.createElement('button');card.type='button';card.className='card';card.style.cssText='display:block;text-align:left;width:100%;color:inherit';card.dataset.id=p.id;const badge=document.createElement('div');badge.className='badge';badge.textContent=p.chart['病案号'];const title=document.createElement('h2');title.textContent=p.chart['姓名']+' · '+p.chart['性别']+' · '+p.chart['年龄'];const desc=document.createElement('p');desc.textContent=p.chart['主诉'];card.append(badge,title,desc);card.onclick=()=>select(p);$('list').append(card)}if(patients.length)select(patients[0])}).catch(e=>$('list').textContent=e.message);
$('admit').onclick=async()=>{if(!selected)return;$('admit').disabled=true;$('status').textContent='正在接诊…';try{const r=await fetch('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patientId:selected.id})});const data=await r.json();if(!r.ok)throw Error(data.error);localStorage.setItem('clinic-session',data.id);location.href='/clinic'}catch(e){$('status').textContent=e.message;$('admit').disabled=false}};
</script></body></html>
