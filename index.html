<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>临界诊室</title>
<style>body{margin:0;background:#0c1720;color:#dbe8ee;font:16px system-ui}header{padding:24px 5%;border-bottom:1px solid #30414d}main{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:20px;padding:24px}section{background:#142530;padding:22px;border-radius:16px}button,input,textarea{padding:12px;border:1px solid #38515f;border-radius:8px;background:#203845;color:white;font:inherit}button{cursor:pointer;background:#267e82}textarea{box-sizing:border-box;width:100%;min-height:85px}#log{height:390px;overflow:auto;white-space:pre-wrap;line-height:1.7}small{color:#9db5bf}svg{width:100%;height:370px}.entry{border-bottom:1px solid #314651;padding:12px 0}#results{white-space:pre-wrap}button:disabled{opacity:.5}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<header><small>AI MEDICAL SIMULATION · 虚构科普体验</small><h1>临界诊室</h1><span id="time">尚未接诊</span></header>
<main><section><h2>患者观察</h2><svg viewBox="0 0 240 420"><g fill="#c4a38c" stroke="#6e7e85" stroke-width="2"><ellipse cx="120" cy="51" rx="30" ry="38"/><path d="M100 88L82 105L68 195L47 251L60 260L89 205L96 160L98 250L90 370L110 380L120 274L130 380L150 370L142 250L144 160L151 205L180 260L193 251L172 195L158 105L140 88Z"/></g><path d="M97 236L143 236L142 267L121 278L98 267Z" fill="#456673"/><g id="marks"></g></svg><small>体表图为示意，局部异常以模型生成的观察描述为准。</small><div id="appearance"></div></section>
<section><h2>诊疗现场</h2><div id="log">输入病例设定，开始一局。</div><textarea id="action" placeholder="向患者提问、检查身体、连接设备、给予治疗，或输入病例设定"></textarea><p><label>推进游戏时间 <input id="minutes" type="number" value="1" min="0" max="120" style="width:60px"> 分钟</label></p><button id="start">开始接诊</button> <button id="act" disabled>执行行动</button> <button id="review" disabled>复盘</button></section>
<section><h2>检查与助手</h2><div id="results">尚未获得检查结果</div><hr><textarea id="question" placeholder="让辅助 AI 分析，或请它建议下一步"></textarea><button id="ask" disabled>询问助手</button><div id="assistant" style="white-space:pre-wrap"></div><button id="execute" hidden>确认执行助手建议</button><p><small>模型调用失败会明确报错，本轮不提交。界面不生成替代病情。</small></p></section></main>
<script>let id,suggestion;const $=s=>document.getElementById(s);function log(t){const d=document.createElement('div');d.className='entry';d.textContent=t;$('log').append(d);d.scrollIntoView({block:'nearest'})}async function call(path,data){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,...data})});const j=await r.json();if(!r.ok)throw Error(j.error);return j}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);if(!id)['act','ask','review'].forEach(k=>$(k).disabled=true)}}function view(v){$('time').textContent='病程时间 '+v.minute+' 分钟';log(v.patient?.speech||JSON.stringify(v.patient));$('results').textContent=JSON.stringify(v.observations,null,2);$('appearance').textContent=JSON.stringify(v.appearance);if(v.uncertainties?.length)log('模拟不确定性：'+v.uncertainties.join('；'))}async function run(f){try{await f()}catch(e){log('本轮失败：'+e.message)}}$('start').onclick=()=>run(async()=>{const r=await call('start',{case:$('action').value||undefined});id=r.id;$('log').textContent='';view(r.view);['act','ask','review'].forEach(k=>$(k).disabled=false)});async function act(text){log('行动：'+text);const r=await call('action',{action:text,minutes:Number($('minutes').value)});if(r.clarification)log(r.clarification);else view(r.view)}$('act').onclick=()=>run(()=>act($('action').value));$('ask').onclick=()=>run(async()=>{const r=await call('assistant',{question:$('question').value});$('assistant').textContent=r.reply;suggestion=r.suggestedAction;$('execute').hidden=!suggestion});$('execute').onclick=()=>run(()=>act(suggestion));$('review').onclick=()=>run(async()=>log((await call('review',{})).review));</script></html>
